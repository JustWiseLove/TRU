<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Truths We Love to Teach</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-bar">
    <div class="user-info" id="userInfo" title="Edit profile">
      <div class="avatar" id="avatarDisplay"><i class="fa-solid fa-user"></i></div>
      <div class="username" id="usernameDisplay">Set name</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="scroll" id="tabScroll">Scroll</div>
      <div class="tab" data-tab="liked" id="tabLiked">Liked<span class="tab-count" id="likedCount"></span></div>
      <div class="tab" data-tab="search" id="tabSearch">Search</div>
    </div>

    <div class="streak-box" id="streakBox">
      <i class="fa-solid fa-sun"></i> Day <span id="dayCount">0</span>
    </div>
  </div>

  <div class="search-bar" id="searchBar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search scriptures, topics..." autocomplete="off">
    <button type="button" id="clearSearch" class="clear-search" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="side-actions" id="sideActions">
    <div class="action-btn" id="likeBtn">
      <div class="action-icon" id="likeIcon"><i class="fa-regular fa-heart"></i></div>
      <div class="action-label">Like</div>
    </div>
    <div class="action-btn" id="shareBtn">
      <div class="action-icon"><i class="fa-solid fa-share"></i></div>
      <div class="action-label">Share</div>
    </div>
  </div>

  <div class="feed" id="feed"></div>
  <div class="toast" id="toast"></div>

  <div class="bottom-nav" id="bottomNav">
    <div class="bottom-tab active" id="groupTruth" data-group="truth">Truth</div>
    <div class="bottom-tab" id="groupProof" data-group="proof">Proof</div>
  </div>

  <div class="modal-overlay" id="profileModal">
    <div class="modal">
      <h2>Your Profile</h2>

      <div class="modal-section">
        <div class="modal-section-title">Account</div>
        <div class="profile-header-row">
          <div class="avatar-preview" id="avatarPreview"><i class="fa-solid fa-user"></i></div>
          <div class="profile-header-fields">
            <label>Username</label>
            <input type="text" id="nameInput" placeholder="Enter a name" maxlength="24">
            <div class="avatar-actions">
              <label class="upload-btn">Upload<input type="file" id="fileInput" accept="image/*"></label>
              <button type="button" class="btn-reset-avatar" id="resetAvatarBtn">Default</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-title">Settings</div>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-name">Audio</span>
            <span class="setting-desc">Auto-read on each card</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="audioToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-name">Card order</span>
            <span class="setting-desc">Default or Shuffle</span>
          </div>
          <div class="segmented" id="orderSegment">
            <button type="button" class="seg-btn active" data-order="default">Default</button>
            <button type="button" class="seg-btn" data-order="shuffle">Shuffle</button>
          </div>
        </div>
        <div class="setting-row theme-row">
          <div class="setting-info">
            <span class="setting-name">Theme</span>
          </div>
          <div class="theme-options" id="themeOptions"></div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-title">Analytics</div>
        <div class="profile-stats">
          <div class="stat-row">
            <span class="stat-label">Streak</span>
            <span class="stat-value"><span id="profileStreak">0</span> <span id="todayCheck"><i class="fa-regular fa-square"></i></span></span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Time Left</span>
            <span class="stat-value" id="timeLeft">-- HRS -- MINS</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Scrolls</span>
            <span class="stat-value"><span id="scrollEXP">0</span> EXP</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Shares</span>
            <span class="stat-value"><span id="shareCount">0</span></span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Liked</span>
            <span class="stat-value"><span id="likedStat">0</span></span>
          </div>
        </div>
      </div>

      <div class="modal-actions" style="flex-direction:column; gap:10px;">
        <button class="btn btn-primary" id="shareProfileBtn">Share Profile</button>
        <div style="display:flex; gap:12px;">
          <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="truth.js"></script>
  <script src="proof.js"></script>
  <script src="script.js"></script>
</body>
</html>
